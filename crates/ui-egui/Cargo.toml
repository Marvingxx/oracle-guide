[package]
name = "oracle-guide-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Oracle Brand Guide egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
oracle-guide-geom = { workspace = true }
oracle-guide-color = { workspace = true }
oracle-guide-doc = { workspace = true }
oracle-guide-fonts = { workspace = true }
oracle-guide-compose = { workspace = true }
oracle-guide-render = { workspace = true }
oracle-guide-tools = { workspace = true }
oracle-guide-engine = { workspace = true }
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-segmentation = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
oracle-guide-format = { workspace = true }

# The Oracle Library window (Window › Oracle Library), shared by the Oracle apps.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oracle-library-ui = { path = "../../../oracle-library/ui" }

[dev-dependencies]
tempfile = { workspace = true }
oracle-guide-idml = { workspace = true }
zip = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
oracle-guide-fonts = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
