[package]
name = "oracle-layout-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Oracle Layout egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
oracle-style = { path = "../../../oracle-library/style" }
craft-ui = { workspace = true }
oracle-layout-geom = { workspace = true }
oracle-layout-color = { workspace = true }
oracle-layout-doc = { workspace = true }
oracle-layout-fonts = { workspace = true }
oracle-layout-compose = { workspace = true }
oracle-layout-render = { workspace = true }
oracle-layout-tools = { workspace = true }
oracle-layout-engine = { workspace = true }
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-segmentation = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
oracle-layout-format = { workspace = true }

# The Oracle Library window (Window › Oracle Library), shared by the Oracle apps.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oracle-library-ui = { path = "../../../oracle-library/ui" }
# Edit Original of another Oracle app's document opens it in that app (Links panel).
oracle-suite-link = { path = "../../../oracle-library/link" }

[dev-dependencies]
tempfile = { workspace = true }
oracle-layout-idml = { workspace = true }
zip = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
oracle-layout-fonts = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
