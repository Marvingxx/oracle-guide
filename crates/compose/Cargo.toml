[package]
name = "oracle-guide-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Brand Guide text composition: paragraph composer (Knuth–Plass), hyphenation, justification, columns, threading, wrap"

[lints]
workspace = true

[dependencies]
unicode-bidi = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-script = { workspace = true }
oracle-guide-geom = { workspace = true }
oracle-guide-color = { workspace = true }
oracle-guide-doc = { workspace = true }
oracle-guide-fonts = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
miniz_oxide = "0.8"
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "greek", "portuguese", "spanish", "norwegian"] }

[dev-dependencies]
oracle-guide-fonts = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
