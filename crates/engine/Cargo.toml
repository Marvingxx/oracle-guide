[package]
name = "oracle-guide-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Brand Guide engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[dependencies]
craft-print = { workspace = true }
craft-docpath = { workspace = true }
oracle-guide-images = { workspace = true }
oracle-guide-geom = { workspace = true }
oracle-guide-color = { workspace = true }
oracle-guide-doc = { workspace = true }
oracle-guide-fonts = { workspace = true }
oracle-guide-compose = { workspace = true }
oracle-guide-render = { workspace = true }
oracle-guide-format = { workspace = true }
oracle-guide-epub = { workspace = true }
oracle-guide-pptx = { workspace = true }
oracle-guide-textimport = { workspace = true }
oracle-guide-pdf = { workspace = true }
oracle-guide-tools = { workspace = true }
oracle-guide-idml = { workspace = true }
indd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
quick-xml = { workspace = true }
caseless = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }
# Documents of the other Oracle apps, drawn by them (io::read_graphic).
oracle-suite-link = { path = "../../../oracle-library/link" }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = { workspace = true }

[dev-dependencies]
oracle-guide-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
