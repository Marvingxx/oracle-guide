[package]
name = "oracle-layout-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Layout renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
oracle-layout-geom = { workspace = true }
oracle-layout-color = { workspace = true }
oracle-layout-doc = { workspace = true }
oracle-layout-fonts = { workspace = true }
oracle-layout-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
craft-pdf = { workspace = true, features = ["raster"] }
oracle-layout-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
