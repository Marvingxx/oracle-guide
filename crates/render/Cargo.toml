[package]
name = "oracle-guide-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Oracle Brand Guide renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
oracle-guide-geom = { workspace = true }
oracle-guide-color = { workspace = true }
oracle-guide-doc = { workspace = true }
oracle-guide-fonts = { workspace = true }
oracle-guide-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
craft-pdf = { workspace = true, features = ["raster"] }
oracle-guide-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
